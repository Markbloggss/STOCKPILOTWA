<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-settings.css">
</head>
<body>
    <nav class="nav-bar">
        <button type="button" onclick="history.back()" class="back-btn">&#8592; Back</button>
    </nav>
    <h1>Settings</h1>
    <p>Manage your account settings below.</p>
    <h2>Stock Pilot Account Settings</h2>
    <form id="account-form">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter password" minlength="8">

        <h2>Preferences</h2>

        <label for="language">Language:</label>
        <select id="language" name="language">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
        </select>

        <label for="notifications">Notifications:</label>
        <input type="checkbox" id="notifications" name="notifications">
        <label class="inline" for="notifications">Enable notifications</label>

            <label class="theme-label">Theme:</label>
            <label class="theme-switch">
                <span class="theme-text">Light</span>
                <input type="checkbox" id="theme-toggle" aria-label="Toggle dark mode">
                <span class="theme-slider"></span>
                <span class="theme-text">Dark</span>
            </label>

            <h2>Privacy</h2>
            <div class="privacy-actions">
                <button type="button" onclick="location.href='#'">Change Password</button>
                <button type="button" class="danger" onclick="if(confirm('Are you sure?')){ location.href='#' }">Delete Account</button>
            </div>

            <h2>Security</h2>
            <div class="security-actions">
                <button type="button" onclick="location.href='#'">Two-Factor Authentication</button>
                <button type="button" onclick="location.href='#'">Active Sessions</button>
            </div>

            <h2>About</h2>
            <div class="about-info">
                <p><strong>StockPilot</strong> v1.0.0</p>
                <p>Manage your inventory and stock with ease.</p>
                <button type="button" onclick="location.href='#'">Check for Updates</button>
            </div>

            <div class="form-actions">
                <button type="submit">Save Changes</button>
                <button type="reset">Cancel</button>
            </div>
        </form>

    <script>
        const toggle = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        toggle.checked = savedTheme === 'dark';

        toggle.addEventListener('change', () => {
            const theme = toggle.checked ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        });
    </script>
</body>
</html>
