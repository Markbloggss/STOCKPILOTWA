<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <nav class="mb-3">
        <button type="button" onclick="history.back()" class="btn btn-outline-secondary">&#8592; Back</button>
    </nav>
    <h1 class="text-center">Settings</h1>
    <p class="text-center text-muted">Manage your account settings below.</p>
    <h2>Stock Pilot Account Settings</h2>
    <form id="account-form" class="card p-4 shadow-sm mx-auto" style="max-width:520px;">
        <div class="mb-3">
            <label for="username" class="form-label">Username:</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password:</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" minlength="8">
        </div>

        <h2>Preferences</h2>
        <div class="mb-3">
            <label for="language" class="form-label">Language:</label>
            <select class="form-select" id="language" name="language">
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
            </select>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="notifications" name="notifications">
            <label class="form-check-label" for="notifications">Enable notifications</label>
        </div>
        <div class="mb-3">
            <label class="form-label">Theme:</label>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="theme-toggle" aria-label="Toggle dark mode">
                <label class="form-check-label" for="theme-toggle">Dark mode</label>
            </div>
        </div>

        <h2>Privacy</h2>
        <div class="d-flex gap-2 justify-content-center mb-3">
            <button type="button" class="btn btn-primary" onclick="location.href='#'">Change Password</button>
            <button type="button" class="btn btn-danger" onclick="if(confirm('Are you sure?')){ location.href='#' }">Delete Account</button>
        </div>

        <h2>Security</h2>
        <div class="d-flex gap-2 justify-content-center mb-3">
            <button type="button" class="btn btn-primary" onclick="location.href='#'">Two-Factor Authentication</button>
            <button type="button" class="btn btn-primary" onclick="location.href='#'">Active Sessions</button>
        </div>

        <h2>About</h2>
        <div class="text-center mb-3">
            <p><strong>StockPilot</strong> v1.0.0</p>
            <p class="text-muted">Manage your inventory and stock with ease.</p>
            <button type="button" class="btn btn-primary" onclick="location.href='#'">Check for Updates</button>
        </div>

        <div class="d-flex gap-2 justify-content-end">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="reset" class="btn btn-secondary">Cancel</button>
        </div>
    </form>
        

    <script>
        const toggle = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        toggle.checked = savedTheme === 'dark';

        toggle.addEventListener('change', () => {
            const theme = toggle.checked ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        });
    </script>
</body>
</html>
