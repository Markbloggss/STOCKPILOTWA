<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="STOCK PILOT">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="text.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-settings.css">
    <style>
        html, body {
            min-height: 100vh;
        }
        body {
            background-image: url('assets/background%20image.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
   <nav class="navbar navbar-translucent md:navbar-expand" data-bs-theme="dark">
    <nav class="logo-show"><img src="favicon.ico" class="logo-img" alt="Logo">  <b>STOCK PILOT</b></nav>
  <div class="container-fluid px-0 justify-content-center">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" href="homepage.html">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="inventory.html">Inventory</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="sales.html">Sales</a>
      </li>
    </ul>
  </div>
</nav>

    <div class="container py-4 pb-5">
        <h1 class="text-center">Settings</h1>
        <p class="text-center text-muted">Manage your account settings below.</p>
        
        <form id="account-form" class="card p-4 shadow-sm mx-auto" style="max-width:520px;">
            <h2>Stock Pilot Account Settings</h2>
            <div class="mb-3">
                <label for="username" class="form-label">Username:</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password:</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" minlength="8">
            </div>

            <h2>Preferences</h2>
            <div class="mb-3">
                <label for="language" class="form-label">Language:</label>
                <select class="form-select" id="language" name="language">
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                </select>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="notifications" name="notifications">
                <label class="form-check-label" for="notifications">Enable notifications</label>
            </div>
            <div class="mb-3">
                <label class="form-label">Theme:</label>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="theme-toggle" aria-label="Toggle dark mode">
                    <label class="form-check-label" for="theme-toggle">Dark mode</label>
                </div>
            </div>

            <h2>Privacy</h2>
            <div class="d-flex gap-2 justify-content-center mb-3">
                <button type="button" class="btn btn-primary" onclick="location.href='#'">Change Password</button>
                <button type="button" class="btn btn-danger" onclick="if(confirm('Are you sure?')){ location.href='#' }">Delete Account</button>
            </div>

            <h2>Security</h2>
            <div class="d-flex gap-2 justify-content-center mb-3">
                <button type="button" class="btn btn-primary" onclick="location.href='#'">Two-Factor Authentication</button>
                <button type="button" class="btn btn-primary" onclick="location.href='#'">Active Sessions</button>
            </div>

            <h2>About</h2>
            <div class="text-center mb-3">
                <p><strong>StockPilot</strong> v1.0.0</p>
                <p class="text-muted">Manage your inventory and stock with ease.</p>
                <button type="button" class="btn btn-primary" onclick="location.href='#'">Check for Updates</button>
            </div>

            <div class="d-flex gap-2 justify-content-end">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <button type="reset" class="btn btn-secondary">Cancel</button>
            </div>
        </form>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    <script>
        const toggle = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (toggle) {
            toggle.checked = savedTheme === 'dark';
        }

        if (toggle) {
            toggle.addEventListener('change', () => {
                const theme = toggle.checked ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
            });
        }

        const accountForm = document.getElementById('account-form');
        if (accountForm) {
            const savedUser = localStorage.getItem('sp_username');
            const savedEmail = localStorage.getItem('sp_email');
            const savedLang = localStorage.getItem('sp_language');
            const savedNotif = localStorage.getItem('sp_notifications');
            if (savedUser) document.getElementById('username').value = savedUser;
            if (savedEmail) document.getElementById('email').value = savedEmail;
            if (savedLang) document.getElementById('language').value = savedLang;
            if (savedNotif === 'true') document.getElementById('notifications').checked = true;

            accountForm.addEventListener('submit', (e) => {
                e.preventDefault();
                localStorage.setItem('sp_username', document.getElementById('username').value);
                localStorage.setItem('sp_email', document.getElementById('email').value);
                localStorage.setItem('sp_language', document.getElementById('language').value);
                localStorage.setItem('sp_notifications', document.getElementById('notifications').checked);
                const pw = document.getElementById('password').value;
                if (pw) {
                    localStorage.setItem('sp_password_set', 'true');
                }
                alert('Settings saved successfully!');
            });
        }
    </script>
</body>
</html>
