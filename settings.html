            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding-bottom: 80px;
        }

</head>
<body>

    <!-- Navigation Bar -->
   <nav class="navbar navbar-translucent md:navbar-expand" data-bs-theme="dark">
    <nav class="logo-show"><img src="favicon.ico" class="logo-img" alt="Logo">  <b>STOCK PILOT</b></nav>

    <div class="container py-4 pb-5">
        <h1 class="text-center">Settings</h1>
        <p class="text-center text-muted">Manage your account settings below.</p>
        
        <form id="account-form" class="card p-4 shadow-sm mx-auto" style="max-width:520px;">
            <h2>Stock Pilot Account Settings</h2>
            <div class="mb-3">
                <label for="username" class="form-label">Username:</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" required>
            </div>

            <h2>Preferences</h2>
            <div class="mb-3">
                <label for="language" class="form-label">Language:</label>
                <select class="form-select" id="language" name="language">
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                </select>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="notifications" name="notifications">
                <label class="form-check-label" for="notifications">Enable notifications</label>
            </div>

            <h2>Privacy</h2>
            <div class="mb-3">
                <label for="current-password" class="form-label">Current Password <span class="text-danger">*</span></label>
                <input type="password" class="form-control" id="current-password" name="current_password" placeholder="Enter current password">
                <div class="form-text">Required to change password or delete account</div>
            </div>
            <div class="d-flex gap-2 justify-content-center mb-3">
                <button type="button" class="btn btn-primary" disabled>Change Password <span class="badge bg-secondary ms-1">Soon</span></button>
                <button type="button" class="btn btn-danger" disabled>Delete Account <span class="badge bg-secondary ms-1">Soon</span></button>
            </div>

            <h2>Security</h2>
            <div class="d-flex gap-2 justify-content-center mb-3">
                <button type="button" class="btn btn-outline-primary" disabled>Two-Factor Auth <span class="badge bg-secondary ms-1">Soon</span></button>
                <button type="button" class="btn btn-outline-primary" disabled>Active Sessions <span class="badge bg-secondary ms-1">Soon</span></button>
            </div>

            <div class="d-flex gap-2 justify-content-end">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <button type="reset" class="btn btn-secondary">Cancel</button>
            </div>
        </form>
    </div>
</body>
