<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Pilot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <footer class="footer">
    <div class="footer-column">
      <h2 class="info-heading" data-info="About Us: Stock Pilot is a leading platform for stock market analysis and trading tools. We help investors make informed decisions with real-time data and insights.">About Us</h2>
      <a href="#">Blog</a>
      <a href="#">Customers</a>
      <a href="#">Terms of service</a>
      <a href="#">Demo</a>
    </div>
    <div class="footer-column">
      <h2 class="info-heading" data-info="Contact Us: Get in touch with our support team. Email: support@stockpilot.com | Phone: 1-800-STOCK | Hours: Mon-Fri 9AM-5PM EST">Contact Us</h2>
      <a href="#">Jobs</a>
      <a href="#">Support</a>
      <a href="#">Contact</a>
    </div>
    <div class="footer-column">
      <h2 class="info-heading" data-info="Social Media: Follow us for daily market updates and trading tips. @StockPilot on Twitter, Instagram, and YouTube">Social Media</h2>
      <a href="#">Instagram</a>
      <a href="#">Youtube</a>
      <a href="#">Twitter</a>
    </div>
    <div class="footer-email-form">
      <h2 class="info-heading" data-info="Join Our Newsletter: Get weekly stock picks, market analysis, and exclusive insights delivered to your inbox. Subscribe now for free!">Join Our Newsletter</h2>
      <form>
        <input type="email" placeholder="Enter your email address" id="footer-email">
        <input type="submit" value="Sign up" id="footer-email-btn">
      </form>
    </div>
  </footer>

  <div id="info-modal" class="info-modal">
    <div class="info-modal-content">
      <span class="info-modal-close">&times;</span>
      <p id="info-modal-text"></p>
    </div>
  </div>
</body>
</html>
