<div class="video-container" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background: #000;">
  <video id="vid1" autoplay muted playsinline style="position: absolute !important; width: 100% !important; height: 100% !important; object-fit: cover !important; transition !important: opacity 1.5s ease-in-out !important; opacity: 1;"></video>
  <video id="vid2" autoplay muted playsinline style="position: absolute !important; width: 100% !important; height: 100% !important; object-fit: cover !important; transition !important: opacity 1.5s ease-in-out !important; opacity: 0;"></video>
</div>


<script>
document.addEventListener("DOMContentLoaded", () => {
  
  const videoFile = "11950054-uhd_3456_2160_30fps.mp4";

  const v1 = document.getElementById("vid1");
  const v2 = document.getElementById("vid2");
  
  v1.src = videoFile;
  v2.src = videoFile;

  function setupCrossfade(active, next) {
    active.ontimeupdate = function() {
      if (active.duration - active.currentTime <= 1.5) {
        active.ontimeupdate = null; 
        
        
        next.play().then(() => {
          next.style.opacity = "1";  
          active.style.opacity = "0";  
          
          
          setTimeout(() => {
            active.pause();
            active.currentTime = 0;
            setupCrossfade(next, active); 
          }, 1500);
        }).catch(err => console.log(err));
      }
    };
  }

  
  v1.play().then(() => {
    setupCrossfade(v1, v2);
  }).catch(err => console.log(err));
});
</script>
